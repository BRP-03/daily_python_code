name: Daily AI Generator

on:

  schedule:

    - cron: "30 14 * * *"

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      - name: Install

        run: |

          pip install -r requirements.txt

      - name: Generate

        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python main.py

      - name: Commit

        run: |

          git config user.name github-actions

          git config user.email actions@github.com

          git add .

          git commit -m "Daily AI project" || exit 0

          git push